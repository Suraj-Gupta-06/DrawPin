version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# DrawPin 2.0 — Local Development Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker-compose up -d            # Start all services
#   docker-compose down             # Stop all services
#   docker-compose down -v          # Stop and delete volumes (wipe data)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: drawpin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: drawpin
      POSTGRES_USER: ${DATABASE_USER:-drawpin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-drawpin_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-drawpin} -d drawpin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drawpin-network

  # ─────────────────────────────────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: drawpin-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drawpin-network

  # ─────────────────────────────────────────────────────────────────────────
  # DrawPin Spring Boot Backend
  # ─────────────────────────────────────────────────────────────────────────
  drawpin-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drawpin-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/drawpin
      DATABASE_USER: ${DATABASE_USER:-drawpin}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-drawpin_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_IN_PRODUCTION_USE_512BIT_RANDOM_SECRET_KEY_MIN64CHARS!!}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - drawpin-network

  # ─────────────────────────────────────────────────────────────────────────
  # MailDev (Local SMTP + Web UI for testing emails)
  # Access the email inbox at: http://localhost:1080
  # ─────────────────────────────────────────────────────────────────────────
  maildev:
    image: maildev/maildev:latest
    container_name: drawpin-maildev
    restart: unless-stopped
    ports:
      - "1025:1025"    # SMTP port (used by Spring Mail)
      - "1080:1080"    # Web UI
    networks:
      - drawpin-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  drawpin-network:
    driver: bridge
